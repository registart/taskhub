<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIAKAD Lite - Manajemen Tugas</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:system-ui,-apple-system,sans-serif;background:#f1f5f9;color:#1e293b;display:flex;min-height:100vh}
        button{cursor:pointer;border:none;border-radius:8px;padding:8px 18px;font-weight:600;font-size:14px;transition:.2s}
        .btn-primary{background:#3b82f6;color:#fff}
        .btn-primary:hover{background:#2563eb}
        .btn-success{background:#22c55e;color:#fff}
        .btn-success:hover{background:#16a34a}
        .btn-danger{background:#ef4444;color:#fff}
        .btn-danger:hover{background:#dc2626}
        .btn-sm{padding:4px 12px;font-size:12px}
        
        /* SIDEBAR */
        .sidebar{width:200px;background:#0f172a;color:#e2e8f0;padding:20px 14px;display:flex;flex-direction:column;gap:4px;height:100vh;position:sticky;top:0;overflow-y:auto;flex-shrink:0}
        .sidebar .brand{font-size:18px;font-weight:700;margin-bottom:16px;color:#facc15}
        .sidebar .menu-item{padding:8px 12px;border-radius:6px;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:10px;font-size:14px}
        .sidebar .menu-item:hover{background:#1e293b}
        .sidebar .menu-item.active{background:#3b82f6;color:#fff}
        .sidebar .divider{border-top:1px solid #334155;margin:8px 0}
        .sidebar .label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#64748b;padding:6px 12px 2px}
        
        /* MAIN */
        .main{flex:1;padding:24px 32px;overflow-y:auto;max-height:100vh}
        .page-title{font-size:24px;font-weight:700;margin-bottom:4px}
        .page-sub{color:#64748b;margin-bottom:20px;font-size:14px}
        
        /* CARD */
        .card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:20px}
        .card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
        .card-header h3{font-size:16px}
        
        /* TABLE */
        table{width:100%;border-collapse:collapse;font-size:13px}
        th{text-align:left;padding:8px 6px;background:#f8fafc;font-weight:600;color:#475569}
        td{padding:8px 6px;border-bottom:1px solid #e9edf2}
        tr:hover td{background:#fafcff}
        
        /* BADGE */
        .badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:11px;font-weight:600}
        .badge-blue{background:#dbeafe;color:#1d4ed8}
        .badge-green{background:#dcfce7;color:#15803d}
        .badge-yellow{background:#fef9c3;color:#a16207}
        .badge-red{background:#fee2e2;color:#b91c1c}
        .badge-gray{background:#e2e8f0;color:#475569}
        
        /* PROGRESS BAR */
        .progress-wrap{display:flex;align-items:center;gap:8px}
        .progress-bar{flex:1;height:6px;background:#e2e8f0;border-radius:10px;overflow:hidden;min-width:60px}
        .progress-bar .fill{height:100%;background:#3b82f6;border-radius:10px;transition:.3s}
        .progress-label{font-weight:600;font-size:12px;min-width:32px}
        
        /* FORM */
        .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}
        .form-grid .full{grid-column:1/-1}
        .form-group{display:flex;flex-direction:column;gap:3px}
        .form-group label{font-weight:600;font-size:12px;color:#334155}
        .form-group input,.form-group select,.form-group textarea{padding:6px 10px;border:1px solid #d1d9e6;border-radius:6px;font-size:13px;font-family:inherit}
        .form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15)}
        .form-group textarea{resize:vertical;min-height:50px}
        .form-group input[type="file"]{padding:6px;border:1px dashed #d1d9e6;background:#f8fafc}
        .form-actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
        .file-link{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;background:#eef2ff;border-radius:4px;color:#4338ca;text-decoration:none;font-size:12px}
        .flex-between{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
        .text-muted{color:#64748b;font-size:13px}
        .hidden{display:none!important}
        
        @media(max-width:768px){
            .sidebar{width:56px;padding:10px 6px}
            .sidebar .brand{font-size:14px;text-align:center}
            .sidebar .menu-item .label-text{display:none}
            .sidebar .label{display:none}
            .main{padding:12px}
            .form-grid{grid-template-columns:1fr}
            table{font-size:11px}
            .card{padding:12px}
        }
    </style>
</head>
<body>

<aside class="sidebar" id="sidebar">
    <div class="brand">📘 SIAKAD</div>
    <div class="label">Master</div>
    <div class="menu-item active" data-page="dashboard">📊 <span class="label-text">Dashboard</span></div>
    <div class="menu-item" data-page="mahasiswa">👨‍🎓 <span class="label-text">Mahasiswa</span></div>
    <div class="menu-item" data-page="kelompok">👥 <span class="label-text">Kelompok</span></div>
    <div class="menu-item" data-page="matakuliah">📖 <span class="label-text">Matkul</span></div>
    <div class="divider"></div>
    <div class="label">Aktivitas</div>
    <div class="menu-item" data-page="tugas">📝 <span class="label-text">Tugas</span></div>
    <div class="menu-item" data-page="progress">📈 <span class="label-text">Progress</span></div>
    <div class="menu-item" data-page="bimbingan">🧑‍🏫 <span class="label-text">Bimbingan</span></div>
    <div class="divider"></div>
    <div class="label">Monitoring</div>
    <div class="menu-item" data-page="timeline">📅 <span class="label-text">Timeline</span></div>
    <div class="menu-item" data-page="deadline">⚠️ <span class="label-text">Deadline</span></div>
</aside>

<main class="main" id="mainContent"></main>

<script>
// ============================================================
//  DATA STORE
// ============================================================
const DB={get:(k,d)=>{try{return JSON.parse(localStorage.getItem('sk_'+k))||d}catch{return d}},set:(k,v)=>localStorage.setItem('sk_'+k,JSON.stringify(v))};

// ============================================================
//  STATE
// ============================================================
const JENIS=['Tugas Biasa','Tugas Besar','Project','Presentasi','Ujian','Praktikum','Bimbingan','Skripsi/Tugas Akhir','Magang/PKL','KKN','Laporan','Lainnya'];
let state={
    mahasiswa:DB.get('mhs',[]),
    kelompok:DB.get('klp',[]),
    matakuliah:DB.get('mk',['Digital Marketing','Pemrograman Web','Basis Data']),
    tugas:DB.get('tgs',[]),
    progress:DB.get('prg',[]),
    bimbingan:DB.get('bim',[]),
};
function saveAll(){Object.keys(state).forEach(k=>DB.set(k==='matakuliah'?'mk':k==='mahasiswa'?'mhs':k==='kelompok'?'klp':k==='tugas'?'tgs':k==='progress'?'prg':k==='bimbingan'?'bim':k,state[k]));}
function genId(){return Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,6)}
function findTugas(id){return state.tugas.find(t=>t.id===id)}
function findMhs(id){return state.mahasiswa.find(m=>m.id===id)}
function findKlp(id){return state.kelompok.find(k=>k.id===id)}
function namaMhs(id){const m=findMhs(id);return m?m.nama:'(tidak ada)'}
function namaKlp(id){const k=findKlp(id);return k?k.nama:'(tidak ada)'}
function namaTarget(t){if(t.target==='Individu')return namaMhs(t.targetId);if(t.target==='Kelompok')return namaKlp(t.targetId);return '-'}
function getProgress(tugasId){const items=state.progress.filter(p=>p.tugasId===tugasId);if(!items.length)return{pct:0,list:[]};const avg=items.reduce((s,p)=>s+(p.persen||0),0)/items.length;return{pct:Math.round(avg),list:items}}
function getBimbingan(tugasId){return state.bimbingan.filter(b=>b.tugasId===tugasId)}

// ============================================================
//  RENDER
// ============================================================
function render(page){
    document.querySelectorAll('.menu-item').forEach(el=>el.classList.toggle('active',el.dataset.page===page));
    const el=document.getElementById('mainContent');
    const pages={dashboard, mahasiswa, kelompok, matakuliah, tugas, progress, bimbingan, timeline, deadline};
    (pages[page]||(()=>el.innerHTML='<p>Halaman tidak ditemukan.</p>'))(el);
}

// ---------- DASHBOARD ----------
function dashboard(el){
    const totalMhs=state.mahasiswa.length,totalTgs=state.tugas.length,totalBim=state.bimbingan.length;
    const selesai=state.tugas.filter(t=>t.status==='Selesai').length;
    const avg=state.tugas.length?Math.round(state.tugas.reduce((s,t)=>s+getProgress(t.id).pct,0)/state.tugas.length):0;
    el.innerHTML=`
    <div class="page-title">📊 Dashboard</div>
    <div class="page-sub">Ringkasan aktivitas</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:20px;">
      ${[{label:'Mahasiswa',val:totalMhs},{label:'Tugas',val:totalTgs},{label:'Bimbingan',val:totalBim},{label:'Selesai',val:selesai+'/'+totalTgs},{label:'Rata-rata',val:avg+'%'}].map(d=>`<div class="card" style="text-align:center;"><h2>${d.val}</h2><span class="text-muted">${d.label}</span></div>`).join('')}
    </div>
    <div class="card"><div class="card-header"><h3>📌 Tugas Terbaru</h3></div>
    ${state.tugas.length===0?'<p class="text-muted">Belum ada tugas.</p>':`
    <table><thead><tr><th>Judul</th><th>Jenis</th><th>Target</th><th>Progress</th><th>Status</th></tr></thead><tbody>
    ${state.tugas.slice(-5).reverse().map(t=>{const p=getProgress(t.id);return`<tr><td><strong>${t.judul}</strong></td><td><span class="badge badge-blue">${t.jenis}</span></td><td>${namaTarget(t)}</td><td><div class="progress-wrap"><div class="progress-bar"><div class="fill" style="width:${p.pct}%"></div></div><span class="progress-label">${p.pct}%</span></div></td><td><span class="badge ${t.status==='Selesai'?'badge-green':'badge-yellow'}">${t.status||'Aktif'}</span></td></tr>`}).join('')}
    </tbody></table>`}</div>
    <div class="card"><div class="card-header"><h3>🧑‍🏫 Bimbingan Terakhir</h3></div>
    ${state.bimbingan.length===0?'<p class="text-muted">Belum ada bimbingan.</p>':`
    <table><thead><tr><th>Tanggal</th><th>Tugas</th><th>Progress</th><th>Status</th></tr></thead><tbody>
    ${state.bimbingan.slice(-5).reverse().map(b=>{const t=findTugas(b.tugasId);return`<tr><td>${b.tanggal}</td><td>${t?t.judul:'(dihapus)'}</td><td>${b.progress}%</td><td><span class="badge ${b.status==='Selesai'?'badge-green':'badge-yellow'}">${b.status||'Proses'}</span></td></tr>`}).join('')}
    </tbody></table>`}</div>`;
}

// ---------- MAHASISWA ----------
function mahasiswa(el){
    el.innerHTML=`
    <div class="flex-between"><div><div class="page-title">👨‍🎓 Mahasiswa</div><div class="page-sub">Kelola data mahasiswa</div></div><button class="btn btn-primary" onclick="showFormMhs()">+ Tambah</button></div>
    <div class="card">${state.mahasiswa.length===0?'<p class="text-muted">Belum ada mahasiswa.</p>':`
    <table><thead><tr><th>NPM</th><th>Nama</th><th>Kelas</th><th>Status</th><th>Aksi</th></tr></thead><tbody>
    ${state.mahasiswa.map(m=>`<tr><td>${m.npm}</td><td>${m.nama}</td><td>${m.kelas}</td><td><span class="badge ${m.status==='Aktif'?'badge-green':'badge-gray'}">${m.status}</span></td><td><button class="btn btn-sm btn-primary" onclick="showFormMhs('${m.id}')">✎</button><button class="btn btn-sm btn-danger" onclick="hapusMhs('${m.id}')">✕</button></td></tr>`).join('')}
    </tbody></table>`}</div>
    <div id="formMhsContainer"></div>`;
}
window.showFormMhs=function(id){
    const d=id?findMhs(id):null,c=document.getElementById('formMhsContainer');
    c.innerHTML=`<div class="card" style="border:2px solid #3b82f6;"><h3>${d?'✎ Edit':'➕ Tambah'} Mahasiswa</h3><div class="form-grid">
    <div class="form-group"><label>NPM</label><input id="fm_npm" value="${d?d.npm:''}"/></div>
    <div class="form-group"><label>Nama</label><input id="fm_nama" value="${d?d.nama:''}"/></div>
    <div class="form-group"><label>Kelas</label><input id="fm_kelas" value="${d?d.kelas:''}"/></div>
    <div class="form-group"><label>Email</label><input id="fm_email" value="${d?d.email:''}"/></div>
    <div class="form-group"><label>Status</label><select id="fm_status"><option value="Aktif" ${d&&d.status==='Aktif'?'selected':''}>Aktif</option><option value="Tidak Aktif" ${d&&d.status==='Tidak Aktif'?'selected':''}>Tidak Aktif</option></select></div>
    </div><div class="form-actions"><button class="btn btn-success" onclick="simpanMhs('${id||''}')">Simpan</button><button class="btn" onclick="document.getElementById('formMhsContainer').innerHTML=''">Batal</button></div></div>`;
};
window.simpanMhs=function(id){
    const npm=document.getElementById('fm_npm').value.trim(),nama=document.getElementById('fm_nama').value.trim(),kelas=document.getElementById('fm_kelas').value.trim(),email=document.getElementById('fm_email').value.trim(),status=document.getElementById('fm_status').value;
    if(!npm||!nama){alert('NPM dan Nama wajib diisi.');return}
    if(id){const m=findMhs(id);if(m)Object.assign(m,{npm,nama,kelas,email,status})}else state.mahasiswa.push({id:genId(),npm,nama,kelas,email,status});
    saveAll();render('mahasiswa');
};
window.hapusMhs=function(id){if(!confirm('Hapus mahasiswa?'))return;state.mahasiswa=state.mahasiswa.filter(m=>m.id!==id);saveAll();render('mahasiswa')};

// ---------- KELOMPOK ----------
function kelompok(el){
    el.innerHTML=`
    <div class="flex-between"><div><div class="page-title">👥 Kelompok</div><div class="page-sub">Kelompok mahasiswa</div></div><button class="btn btn-primary" onclick="showFormKlp()">+ Tambah</button></div>
    <div class="card">${state.kelompok.length===0?'<p class="text-muted">Belum ada kelompok.</p>':`
    <table><thead><tr><th>Nama</th><th>Kelas</th><th>Ketua</th><th>Anggota</th><th>Aksi</th></tr></thead><tbody>
    ${state.kelompok.map(k=>{const ketua=namaMhs(k.ketuaId),anggota=(k.anggotaIds||[]).map(id=>namaMhs(id)).join(', ');return`<tr><td><strong>${k.nama}</strong></td><td>${k.kelas}</td><td>${ketua}</td><td>${anggota||'-'}</td><td><button class="btn btn-sm btn-primary" onclick="showFormKlp('${k.id}')">✎</button><button class="btn btn-sm btn-danger" onclick="hapusKlp('${k.id}')">✕</button></td></tr>`}).join('')}
    </tbody></table>`}</div>
    <div id="formKlpContainer"></div>`;
}
window.showFormKlp=function(id){
    const d=id?findKlp(id):null,c=document.getElementById('formKlpContainer');
    const mhsOpt=state.mahasiswa.map(m=>`<option value="${m.id}" ${d&&(d.ketuaId===m.id||(d.anggotaIds||[]).includes(m.id))?'selected':''}>${m.nama} (${m.npm})</option>`).join('');
    c.innerHTML=`<div class="card" style="border:2px solid #3b82f6;"><h3>${d?'✎ Edit':'➕ Tambah'} Kelompok</h3><div class="form-grid">
    <div class="form-group"><label>Nama Kelompok</label><input id="fk_nama" value="${d?d.nama:''}"/></div>
    <div class="form-group"><label>Kelas</label><input id="fk_kelas" value="${d?d.kelas:''}"/></div>
    <div class="form-group"><label>Ketua</label><select id="fk_ketua"><option value="">-- pilih --</option>${mhsOpt}</select></div>
    <div class="form-group"><label>Anggota (ctrl+klik multi)</label><select id="fk_anggota" multiple style="min-height:60px;">${mhsOpt}</select></div>
    </div><div class="form-actions"><button class="btn btn-success" onclick="simpanKlp('${id||''}')">Simpan</button><button class="btn" onclick="document.getElementById('formKlpContainer').innerHTML=''">Batal</button></div></div>`;
    if(d){const sel=document.getElementById('fk_anggota'),ids=d.anggotaIds||[];for(let o of sel.options)if(ids.includes(o.value))o.selected=true}
};
window.simpanKlp=function(id){
    const nama=document.getElementById('fk_nama').value.trim(),kelas=document.getElementById('fk_kelas').value.trim(),ketuaId=document.getElementById('fk_ketua').value;
    const anggotaIds=Array.from(document.getElementById('fk_anggota').selectedOptions).map(o=>o.value);
    if(!nama||!ketuaId){alert('Nama dan Ketua wajib diisi.');return}
    if(id){const k=findKlp(id);if(k)Object.assign(k,{nama,kelas,ketuaId,anggotaIds})}else state.kelompok.push({id:genId(),nama,kelas,ketuaId,anggotaIds});
    saveAll();render('kelompok');
};
window.hapusKlp=function(id){if(!confirm('Hapus kelompok?'))return;state.kelompok=state.kelompok.filter(k=>k.id!==id);saveAll();render('kelompok')};

// ---------- MATA KULIAH ----------
function matakuliah(el){
    el.innerHTML=`
    <div class="flex-between"><div><div class="page-title">📖 Mata Kuliah</div><div class="page-sub">Daftar mata kuliah</div></div><button class="btn btn-primary" onclick="tambahMatkul()">+ Tambah</button></div>
    <div class="card">${state.matakuliah.length===0?'<p class="text-muted">Belum ada mata kuliah.</p>':`
    <ul style="list-style:none;display:flex;flex-wrap:wrap;gap:6px;">${state.matakuliah.map(m=>`<li style="background:#eef2ff;padding:4px 14px;border-radius:16px;display:flex;align-items:center;gap:6px;font-size:13px;">${m}<span style="cursor:pointer;color:#ef4444;font-weight:bold;" onclick="hapusMatkul('${m}')">✕</span></li>`).join('')}</ul>`}</div>`;
}
window.tambahMatkul=function(){const n=prompt('Nama Mata Kuliah:');if(n&&n.trim()){state.matakuliah.push(n.trim());saveAll();render('matakuliah')}};
window.hapusMatkul=function(n){if(!confirm(`Hapus "${n}"?`))return;state.matakuliah=state.matakuliah.filter(m=>m!==n);saveAll();render('matakuliah')};

// ---------- TUGAS ----------
function tugas(el){
    el.innerHTML=`
    <div class="flex-between"><div><div class="page-title">📝 Tugas</div><div class="page-sub">Semua jenis tugas</div></div><button class="btn btn-primary" onclick="showFormTugas()">+ Tambah</button></div>
    <div class="card">${state.tugas.length===0?'<p class="text-muted">Belum ada tugas.</p>':`
    <table><thead><tr><th>Judul</th><th>Jenis</th><th>Matkul</th><th>Target</th><th>Deadline</th><th>Progress</th><th>Status</th><th>Aksi</th></tr></thead><tbody>
    ${state.tugas.map(t=>{const p=getProgress(t.id);return`<tr><td><strong>${t.judul}</strong></td><td><span class="badge badge-blue">${t.jenis}</span></td><td>${t.matakuliah}</td><td>${namaTarget(t)}</td><td>${t.deadline||'-'}</td><td><div class="progress-wrap"><div class="progress-bar"><div class="fill" style="width:${p.pct}%"></div></div><span class="progress-label">${p.pct}%</span></div></td><td><span class="badge ${t.status==='Selesai'?'badge-green':'badge-yellow'}">${t.status||'Aktif'}</span></td><td><button class="btn btn-sm btn-primary" onclick="showFormTugas('${t.id}')">✎</button><button class="btn btn-sm btn-danger" onclick="hapusTugas('${t.id}')">✕</button></td></tr>`}).join('')}
    </tbody></table>`}</div>
    <div id="formTugasContainer"></div>`;
}
window.showFormTugas=function(id){
    const d=id?findTugas(id):null,c=document.getElementById('formTugasContainer');
    const mkOpt=state.matakuliah.map(m=>`<option value="${m}" ${d&&d.matakuliah===m?'selected':''}>${m}</option>`).join('');
    const mhsOpt=state.mahasiswa.map(m=>`<option value="${m.id}" ${d&&d.target==='Individu'&&d.targetId===m.id?'selected':''}>${m.nama}</option>`).join('');
    const klmOpt=state.kelompok.map(k=>`<option value="${k.id}" ${d&&d.target==='Kelompok'&&d.targetId===k.id?'selected':''}>${k.nama}</option>`).join('');
    const showExtra=d&&d.jenis==='Tugas Besar';
    const jenisOpt=JENIS.map(j=>`<option value="${j}" ${d&&d.jenis===j?'selected':''}>${j}</option>`).join('');
    c.innerHTML=`<div class="card" style="border:2px solid #3b82f6;"><h3>${d?'✎ Edit':'➕ Tambah'} Tugas</h3><div class="form-grid">
    <div class="form-group"><label>Judul</label><input id="ft_judul" value="${d?d.judul:''}"/></div>
    <div class="form-group"><label>Jenis</label><select id="ft_jenis" onchange="toggleExtraTugas()">${jenisOpt}</select></div>
    <div class="form-group"><label>Mata Kuliah</label><select id="ft_matkul">${mkOpt}</select></div>
    <div class="form-group"><label>Deskripsi</label><textarea id="ft_deskripsi">${d?d.deskripsi:''}</textarea></div>
    <div class="form-group"><label>Target</label><select id="ft_target" onchange="toggleTargetTugas()"><option value="Individu" ${d&&d.target==='Individu'?'selected':''}>Individu</option><option value="Kelompok" ${d&&d.target==='Kelompok'?'selected':''}>Kelompok</option></select></div>
    <div class="form-group"><label>Pilih Target</label><select id="ft_targetId"><option value="">-- pilih --</option>${d&&d.target==='Individu'?mhsOpt:klmOpt}</select></div>
    <div class="form-group"><label>Deadline</label><input type="date" id="ft_deadline" value="${d?d.deadline:''}"/></div>
    <div class="form-group"><label>Bobot (%)</label><input type="number" id="ft_bobot" value="${d?d.bobot:10}"/></div>
    <div class="form-group"><label>Status</label><select id="ft_status"><option value="Aktif" ${d&&d.status==='Aktif'?'selected':''}>Aktif</option><option value="Selesai" ${d&&d.status==='Selesai'?'selected':''}>Selesai</option><option value="Draft" ${d&&d.status==='Draft'?'selected':''}>Draft</option></select></div>
    <div class="form-group full" id="extraTugasContainer" style="${showExtra?'':'display:none;'}"><hr/><h4>📌 Detail Tugas Besar</h4><div class="form-grid"><div class="form-group"><label>Project</label><input id="ft_project" value="${d?d.project:''}"/></div><div class="form-group"><label>Problem</label><input id="ft_problem" value="${d?d.problem:''}"/></div><div class="form-group"><label>Target User</label><input id="ft_user" value="${d?d.user:''}"/></div><div class="form-group"><label>Output</label><input id="ft_output" value="${d?d.output:''}"/></div></div></div>
    </div><div class="form-actions"><button class="btn btn-success" onclick="simpanTugas('${id||''}')">Simpan</button><button class="btn" onclick="document.getElementById('formTugasContainer').innerHTML=''">Batal</button></div></div>`;
    if(d&&d.targetId){const sel=document.getElementById('ft_targetId');for(let o of sel.options)if(o.value===d.targetId)o.selected=true}
};
window.toggleExtraTugas=function(){document.getElementById('extraTugasContainer').style.display=document.getElementById('ft_jenis').value==='Tugas Besar'?'block':'none'};
window.toggleTargetTugas=function(){
    const target=document.getElementById('ft_target').value,sel=document.getElementById('ft_targetId');
    const mhsOpt=state.mahasiswa.map(m=>`<option value="${m.id}">${m.nama}</option>`).join('');
    const klmOpt=state.kelompok.map(k=>`<option value="${k.id}">${k.nama}</option>`).join('');
    sel.innerHTML=`<option value="">-- pilih --</option>`+(target==='Individu'?mhsOpt:klmOpt);
};
window.simpanTugas=function(id){
    const judul=document.getElementById('ft_judul').value.trim(),jenis=document.getElementById('ft_jenis').value;
    const matakuliah=document.getElementById('ft_matkul').value,deskripsi=document.getElementById('ft_deskripsi').value.trim();
    const target=document.getElementById('ft_target').value,targetId=document.getElementById('ft_targetId').value;
    const deadline=document.getElementById('ft_deadline').value,bobot=parseInt(document.getElementById('ft_bobot').value)||0;
    const status=document.getElementById('ft_status').value;
    if(!judul||!targetId){alert('Judul dan Target wajib diisi.');return}
    const extra={};if(jenis==='Tugas Besar'){extra.project=document.getElementById('ft_project').value.trim();extra.problem=document.getElementById('ft_problem').value.trim();extra.user=document.getElementById('ft_user').value.trim();extra.output=document.getElementById('ft_output').value.trim()}
    if(id){const t=findTugas(id);if(t)Object.assign(t,{judul,jenis,matakuliah,deskripsi,target,targetId,deadline,bobot,status,...extra})}else state.tugas.push({id:genId(),judul,jenis,matakuliah,deskripsi,target,targetId,deadline,bobot,status,...extra});
    saveAll();render('tugas');
};
window.hapusTugas=function(id){if(!confirm('Hapus tugas?'))return;state.tugas=state.tugas.filter(t=>t.id!==id);state.progress=state.progress.filter(p=>p.tugasId!==id);state.bimbingan=state.bimbingan.filter(b=>b.tugasId!==id);saveAll();render('tugas')};

// ---------- PROGRESS ----------
function progress(el){
    el.innerHTML=`
    <div class="page-title">📈 Progress</div>
    <div class="page-sub">Kelola progress per tugas</div>
    <div class="card"><div class="card-header"><h3>Daftar Progress</h3></div>
    ${state.progress.length===0?'<p class="text-muted">Belum ada progress.</p>':`
    <table><thead><tr><th>Tugas</th><th>Tahapan</th><th>Persen</th><th>Status</th><th>Dokumen</th><th>Aksi</th></tr></thead><tbody>
    ${state.progress.map(p=>{const t=findTugas(p.tugasId);return`<tr><td>${t?t.judul:'(dihapus)'}</td><td>${p.tahapan||'-'}</td><td>${p.persen}%</td><td><span class="badge ${p.status==='Selesai'?'badge-green':'badge-yellow'}">${p.status||'Proses'}</span></td><td>${p.fileName?`<a href="${p.fileData||'#'}" class="file-link" target="_blank">📎 ${p.fileName}</a>`:'-'}</td><td><button class="btn btn-sm btn-primary" onclick="showFormProgress('${p.id}')">✎</button><button class="btn btn-sm btn-danger" onclick="hapusProgress('${p.id}')">✕</button></td></tr>`}).join('')}
    </tbody></table>`}
    <div style="margin-top:12px;"><button class="btn btn-primary" onclick="showFormProgress()">+ Tambah Progress</button></div></div>
    <div id="formProgressContainer"></div>`;
}
window.showFormProgress=function(id){
    const d=id?state.progress.find(p=>p.id===id):null,c=document.getElementById('formProgressContainer');
    const tugasOpt=state.tugas.map(t=>`<option value="${t.id}" ${d&&d.tugasId===t.id?'selected':''}>${t.judul}</option>`).join('');
    c.innerHTML=`<div class="card" style="border:2px solid #3b82f6;"><h3>${d?'✎ Edit':'➕ Tambah'} Progress</h3><div class="form-grid">
    <div class="form-group"><label>Tugas</label><select id="fp_tugas">${tugasOpt}</select></div>
    <div class="form-group"><label>Tahapan</label><input id="fp_tahapan" value="${d?d.tahapan:''}" placeholder="Analisis, UI, Testing"/></div>
    <div class="form-group"><label>Persentase</label><input type="number" id="fp_persen" value="${d?d.persen:0}" min="0" max="100"/></div>
    <div class="form-group"><label>Status</label><select id="fp_status"><option value="Proses" ${d&&d.status==='Proses'?'selected':''}>Proses</option><option value="Selesai" ${d&&d.status==='Selesai'?'selected':''}>Selesai</option></select></div>
    <div class="form-group full"><label>Catatan / Bukti</label><textarea id="fp_catatan">${d?d.catatan:''}</textarea></div>
    <div class="form-group full"><label>📎 Upload Dokumentasi</label><input type="file" id="fp_file" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png,.zip"/>${d&&d.fileName?`<p style="font-size:12px;color:#64748b;margin-top:4px;">File: <strong>${d.fileName}</strong></p>`:''}<small style="color:#64748b;">PDF, DOC, JPG, PNG, ZIP</small></div>
    </div><div class="form-actions"><button class="btn btn-success" onclick="simpanProgress('${id||''}')">Simpan</button><button class="btn" onclick="document.getElementById('formProgressContainer').innerHTML=''">Batal</button></div></div>`;
};
window.simpanProgress=function(id){
    const tugasId=document.getElementById('fp_tugas').value,tahapan=document.getElementById('fp_tahapan').value.trim();
    const persen=parseInt(document.getElementById('fp_persen').value)||0,status=document.getElementById('fp_status').value;
    const catatan=document.getElementById('fp_catatan').value.trim(),fileInput=document.getElementById('fp_file');
    if(!tugasId){alert('Pilih tugas.');return}
    let fileName=null,fileData=null;
    if(fileInput.files&&fileInput.files[0]){const file=fileInput.files[0];fileName=file.name;const reader=new FileReader();reader.onload=function(e){saveProgressData(id,tugasId,tahapan,persen,status,catatan,fileName,e.target.result)};reader.readAsDataURL(file);return}
    if(id){const existing=state.progress.find(p=>p.id===id);if(existing){fileName=existing.fileName||null;fileData=existing.fileData||null}}
    saveProgressData(id,tugasId,tahapan,persen,status,catatan,fileName,fileData);
};
function saveProgressData(id,tugasId,tahapan,persen,status,catatan,fileName,fileData){
    if(id){const p=state.progress.find(x=>x.id===id);if(p){Object.assign(p,{tugasId,tahapan,persen,status,catatan});if(fileName){p.fileName=fileName;p.fileData=fileData}}}else state.progress.push({id:genId(),tugasId,tahapan,persen,status,catatan,fileName:fileName||null,fileData:fileData||null});
    saveAll();render('progress');
}
window.hapusProgress=function(id){if(!confirm('Hapus progress?'))return;state.progress=state.progress.filter(p=>p.id!==id);saveAll();render('progress')};

// ---------- BIMBINGAN ----------
function bimbingan(el){
    el.innerHTML=`
    <div class="flex-between"><div><div class="page-title">🧑‍🏫 Bimbingan</div><div class="page-sub">Catatan bimbingan</div></div><button class="btn btn-primary" onclick="showFormBimbingan()">+ Tambah</button></div>
    <div class="card">${state.bimbingan.length===0?'<p class="text-muted">Belum ada bimbingan.</p>':`
    <table><thead><tr><th>Tanggal</th><th>Tugas</th><th>Progress</th><th>Status</th><th>Dokumen</th><th>Aksi</th></tr></thead><tbody>
    ${state.bimbingan.map(b=>{const t=findTugas(b.tugasId);return`<tr><td>${b.tanggal}</td><td>${t?t.judul:'(dihapus)'}</td><td>${b.progress}%</td><td><span class="badge ${b.status==='Selesai'?'badge-green':'badge-yellow'}">${b.status||'Proses'}</span></td><td>${b.fileName?`<a href="${b.fileData||'#'}" class="file-link" target="_blank">📎 ${b.fileName}</a>`:'-'}</td><td><button class="btn btn-sm btn-primary" onclick="showFormBimbingan('${b.id}')">✎</button><button class="btn btn-sm btn-danger" onclick="hapusBimbingan('${b.id}')">✕</button></td></tr>`}).join('')}
    </tbody></table>`}</div>
    <div id="formBimbinganContainer"></div>`;
}
window.showFormBimbingan=function(id){
    const d=id?state.bimbingan.find(b=>b.id===id):null,c=document.getElementById('formBimbinganContainer');
    const tugasOpt=state.tugas.map(t=>`<option value="${t.id}" ${d&&d.tugasId===t.id?'selected':''}>${t.judul}</option>`).join('');
    c.innerHTML=`<div class="card" style="border:2px solid #3b82f6;"><h3>${d?'✎ Edit':'➕ Tambah'} Bimbingan</h3><div class="form-grid">
    <div class="form-group"><label>Tugas</label><select id="fb_tugas">${tugasOpt}</select></div>
    <div class="form-group"><label>Tanggal</label><input type="date" id="fb_tanggal" value="${d?d.tanggal:''}"/></div>
    <div class="form-group"><label>Progress (%)</label><input type="number" id="fb_progress" value="${d?d.progress:0}" min="0" max="100"/></div>
    <div class="form-group"><label>Status</label><select id="fb_status"><option value="Proses" ${d&&d.status==='Proses'?'selected':''}>Proses</option><option value="Revisi" ${d&&d.status==='Revisi'?'selected':''}>Revisi</option><option value="Selesai" ${d&&d.status==='Selesai'?'selected':''}>Selesai</option></select></div>
    <div class="form-group full"><label>Pembahasan</label><textarea id="fb_pembahasan">${d?d.pembahasan:''}</textarea></div>
    <div class="form-group full"><label>Catatan Dosen</label><textarea id="fb_catatan">${d?d.catatan:''}</textarea></div>
    <div class="form-group full"><label>📎 Upload Dokumentasi</label><input type="file" id="fb_file" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png,.zip"/>${d&&d.fileName?`<p style="font-size:12px;color:#64748b;margin-top:4px;">File: <strong>${d.fileName}</strong></p>`:''}<small style="color:#64748b;">PDF, DOC, JPG, PNG, ZIP</small></div>
    <div class="form-group"><label>Tindak Lanjut</label><input id="fb_tindak" value="${d?d.tindak:''}"/></div>
    <div class="form-group"><label>Deadline Follow-up</label><input type="date" id="fb_deadline" value="${d?d.deadline:''}"/></div>
    </div><div class="form-actions"><button class="btn btn-success" onclick="simpanBimbingan('${id||''}')">Simpan</button><button class="btn" onclick="document.getElementById('formBimbinganContainer').innerHTML=''">Batal</button></div></div>`;
};
window.simpanBimbingan=function(id){
    const tugasId=document.getElementById('fb_tugas').value,tanggal=document.getElementById('fb_tanggal').value;
    const progress=parseInt(document.getElementById('fb_progress').value)||0,status=document.getElementById('fb_status').value;
    const pembahasan=document.getElementById('fb_pembahasan').value.trim(),catatan=document.getElementById('fb_catatan').value.trim();
    const tindak=document.getElementById('fb_tindak').value.trim(),deadline=document.getElementById('fb_deadline').value;
    const fileInput=document.getElementById('fb_file');
    if(!tugasId||!tanggal){alert('Tugas dan Tanggal wajib diisi.');return}
    let fileName=null,fileData=null;
    if(fileInput.files&&fileInput.files[0]){const file=fileInput.files[0];fileName=file.name;const reader=new FileReader();reader.onload=function(e){saveBimbinganData(id,tugasId,tanggal,progress,status,pembahasan,catatan,tindak,deadline,fileName,e.target.result)};reader.readAsDataURL(file);return}
    if(id){const existing=state.bimbingan.find(b=>b.id===id);if(existing){fileName=existing.fileName||null;fileData=existing.fileData||null}}
    saveBimbinganData(id,tugasId,tanggal,progress,status,pembahasan,catatan,tindak,deadline,fileName,fileData);
};
function saveBimbinganData(id,tugasId,tanggal,progress,status,pembahasan,catatan,tindak,deadline,fileName,fileData){
    if(id){const b=state.bimbingan.find(x=>x.id===id);if(b){Object.assign(b,{tugasId,tanggal,progress,status,pembahasan,catatan,tindak,deadline});if(fileName){b.fileName=fileName;b.fileData=fileData}}}else state.bimbingan.push({id:genId(),tugasId,tanggal,progress,status,pembahasan,catatan,tindak,deadline,fileName:fileName||null,fileData:fileData||null});
    saveAll();render('bimbingan');
}
window.hapusBimbingan=function(id){if(!confirm('Hapus bimbingan?'))return;state.bimbingan=state.bimbingan.filter(b=>b.id!==id);saveAll();render('bimbingan')};

// ---------- TIMELINE ----------
function timeline(el){
    el.innerHTML=`
    <div class="page-title">📅 Timeline</div>
    <div class="page-sub">Jadwal tugas berdasarkan deadline</div>
    <div class="card">${state.tugas.length===0?'<p class="text-muted">Belum ada tugas.</p>':`
    <ul style="list-style:none;padding:0;">${state.tugas.sort((a,b)=>(a.deadline||'').localeCompare(b.deadline||'')).map(t=>{const p=getProgress(t.id),bims=getBimbingan(t.id),last=bims.length?bims[bims.length-1]:null;return`<li style="padding:10px 0;border-bottom:1px solid #e9edf2;"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;"><div><strong>${t.judul}</strong> <span class="badge badge-blue">${t.jenis}</span> <span class="text-muted">${t.matakuliah}</span></div><div>Deadline: <strong>${t.deadline||'-'}</strong></div></div><div style="display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:#475569;margin-top:4px;"><span>📈 ${p.pct}%</span><span>📝 ${bims.length} bimbingan</span>${last?`<span>🧑‍🏫 Terakhir: ${last.tanggal} — ${last.status}</span>`:''}<span>Target: ${namaTarget(t)}</span></div></li>`}).join('')}</ul>`}</div>`;
}

// ---------- DEADLINE ----------
function deadline(el){
    const today=new Date().toISOString().slice(0,10);
    const near=state.tugas.filter(t=>t.deadline&&t.deadline>=today&&t.status!=='Selesai').sort((a,b)=>a.deadline.localeCompare(b.deadline));
    el.innerHTML=`
    <div class="page-title">⚠️ Deadline</div>
    <div class="page-sub">Tugas mendekati deadline</div>
    <div class="card">${near.length===0?'<p class="text-muted">Tidak ada tugas mendekati deadline.</p>':`
    <table><thead><tr><th>Judul</th><th>Matkul</th><th>Target</th><th>Deadline</th><th>Progress</th><th>Status</th></tr></thead><tbody>
    ${near.map(t=>{const p=getProgress(t.id);return`<tr><td><strong>${t.judul}</strong></td><td>${t.matakuliah}</td><td>${namaTarget(t)}</td><td><span class="badge ${t.deadline===today?'badge-red':'badge-yellow'}">${t.deadline}</span></td><td><div class="progress-wrap"><div class="progress-bar"><div class="fill" style="width:${p.pct}%"></div></div><span class="progress-label">${p.pct}%</span></div></td><td><span class="badge badge-yellow">${t.status||'Aktif'}</span></td></tr>`}).join('')}
    </tbody></table>`}</div>`;
}

// ============================================================
//  INIT
// ============================================================
document.querySelectorAll('.menu-item').forEach(el=>el.addEventListener('click',()=>render(el.dataset.page)));
render('dashboard');
</script>
</body>
</html>
